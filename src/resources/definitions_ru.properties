# Названия ситуационных объектов трассы (metadata.locale_trace_name в constructs.yml).
# Род названия должен совпадать с metadata.locale_pronoun соответствующего объекта.

# Конструкции
program=программа
loop=цикл
alternative=ветвление
multiple_alternative=множественное ветвление
block=блок кода
var=переменная
function_def=определение функции
function_call=вызов функции
call_prototype=прототип функции
catch=блок перехвата исключений
class=класс
struct=структура
method=метод
type=тип данных

# Действия
statement=действие
condition=условие
condition_for_each=условие существования следующего элемента
condition_range_for=условие на счётчик
case_branch=ветвь
case_exit=завершение ветви
container=контейнер
init=инициализация
update=обновление счётчика цикла
break=оператор <code>break</code>
continue=переход на следующую итерацию цикла
return=вычисление результата функции
exception=исключение

begin=начало
end=конец

# Значения условий
true=истина
false=ложь

# Служебные слова
on_line=на строке
traced_suffix=в трассе
