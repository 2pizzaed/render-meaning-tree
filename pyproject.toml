[project]
name = "render-meaning-tree"
version = "0.1.0"
description = "CtrlFlow domain visualization and generation tool for CompPrehension"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "jinja2>=3.1.6",
    "colorama>=0.4.6",
    "pyyaml>=6.0.1",
    "pydot>=4.0.1",
    "beautifulsoup4>=4.14.2",
    "lxml>=6.0.2",
    "httpx>=0.28.1",
]

[build-system]
requires = ["uv_build>=0.11.25,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "flask>=3.1.2",
    "pyright>=1.1.409",
    "pytest>=8.3.5",
    "pytest-xdist>=3.6.1",
    "ruff>=0.15.11",
]

[project.scripts]
find-correct-trace-actions = "test.scripts.find_correct_trace_actions:main"
render-construct-automaton = "test.scripts.render_construct_automaton:main"
tree-loqi-to-xml = "src.tree_loqi_to_xml:main"
validate-dsm = "src.validate_dsm:main"

[tool.pytest.ini_options]
addopts = "-q -s --tb=short --disable-warnings"
markers = [
    "serial: tests that should run outside xdist parallel scheduling",
]
filterwarnings = [
    "ignore::pytest.PytestRemovedIn10Warning",
    "ignore::DeprecationWarning:pydot",
]

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff]
extend-exclude = ["test/data"]

[tool.pyright]
exclude = ["test/data", "**/node_modules", "**/__pycache__", "**/.*", ".venv"]

[tool.uv.build-backend]
module-name = ["src", "test"]
module-root = ""
