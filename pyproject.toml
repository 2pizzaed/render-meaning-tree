[project]
name = "render-meaning-tree"
version = "0.1.0"
description = "CtrlFlow domain visualization and generation tool for CompPrehension"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "jinja2>=3.1.6",
    "pytest>=8.3.5",
    "matplotlib>=3.8.4",
    "colorama>=0.4.6",
    "pyyaml>=6.0.1",
    "pydot>=4.0.1",
    "beautifulsoup4>=4.14.2",
    "flask>=3.1.2",
    "lxml>=6.0.2",
]

[dependency-groups]
dev = [
    "pyright>=1.1.409",
    "ruff>=0.15.11",
]

[tool.pytest.ini_options]
addopts = "-q -s --tb=line --disable-warnings"
filterwarnings = [
    "ignore::pytest.PytestRemovedIn10Warning",
    "ignore::DeprecationWarning:pydot",
]

[tool.ruff]
extend-exclude = ["test/data"]

[tool.pyright]
exclude = ["test/data", "**/node_modules", "**/__pycache__", "**/.*", ".venv"]
