<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AST & Injection Playground</title>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0; padding: 0;
            background: #f4f4f9; color: #333;
            display: flex; height: 100vh; overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: 350px; background: #fff; border-right: 1px solid #ddd;
            display: flex; flex-direction: column; padding: 20px; box-shadow: 2px 0 5px rgba(0,0,0,0.05); z-index: 10;
        }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 13px; }
        select, textarea, button.submit-btn { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; font-family: inherit; }
        textarea { font-family: 'Consolas', monospace; font-size: 12px; height: 250px; resize: vertical; }
        button.submit-btn { background: #0066cc; color: white; border: none; cursor: pointer; font-weight: 600; margin-top: 10px; }
        button.submit-btn:hover { background: #0052a3; }

        /* Main Area */
        .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        
        .preview-area { flex: 1; padding: 20px; overflow-y: auto; background: #fafafa; }

        /* Bottom Panel with Tabs */
        .bottom-panel {
            height: 350px; background: #fff; border-top: 1px solid #ddd;
            display: flex; flex-direction: column;
        }

        .tabs { display: flex; background: #f0f0f0; border-bottom: 1px solid #ddd; }
        .tab {
            padding: 10px 20px; cursor: pointer; font-size: 13px; font-weight: 600; color: #666;
            border-right: 1px solid #ddd; background: #f0f0f0; border: none; outline: none;
        }
        .tab.active { background: #fff; color: #0066cc; border-top: 2px solid #0066cc; }
        .tab:hover:not(.active) { background: #e0e0e0; }

        .tab-content { flex: 1; overflow-y: auto; padding: 15px; display: none; }
        .tab-content.active { display: block; }

        /* Node Inspector Styles */
        .node-path { font-family: 'Consolas', monospace; font-size: 12px; }
        .node-item {
            padding: 6px 10px; margin-bottom: 4px; background: #f8f9fa;
            border-left: 3px solid #ccc; cursor: default; display: flex; align-items: center; justify-content: space-between;
        }
        .node-item .badge { 
            background: #e0e0e0; 
            padding: 2px 6px; 
            border-radius: 4px; 
            font-size: 0.85em; 
            margin-left: 5px;
        }
        .node-item .badge.range-badge {
            background: #e8f5e9;
            color: #1b5e20;
            border: 1px solid #c8e6c9;
        }
        .node-item:hover { background: #e9ecef; border-left-color: #0066cc; }
        .node-item .main-info { display: flex; gap: 10px; align-items: center; }
        .node-item .type { font-weight: bold; color: #d63384; }
        .node-item .meta { font-size: 0.9em; color: #666; display: flex; gap: 10px; }

        /* Trace Styles */
        .trace-container { display: flex; flex-direction: column; height: 100%; }
        .trace-controls { margin-bottom: 10px; }
        #trace-output { flex: 1; width: 100%; font-family: 'Consolas', monospace; font-size: 12px; padding: 10px; border: 1px solid #ddd; resize: none; background: #fcfcfc; }

        .error-box { background: #ffebee; color: #c62828; padding: 15px; border: 1px solid #ffcdd2; margin-bottom: 20px; white-space: pre-wrap; font-family: monospace; font-size: 12px; }
    </style>
</head>
<body>

    <div class="sidebar">
        <h3>Playground</h3>
        <form method="POST" action="/">
            <div class="form-group">
                <label>Language</label>
                <select name="language">
                    <option value="java" {% if language == 'java' %}selected{% endif %}>Java</option>
                    <option value="python" {% if language == 'python' %}selected{% endif %}>Python</option>
                    <option value="cpp" {% if language == 'cpp' %}selected{% endif %}>C++</option>
                </select>
            </div>
            <div class="form-group">
                <label>Code</label>
                <textarea name="code" spellcheck="false">{{ code }}</textarea>
            </div>
            <button type="submit" class="submit-btn">Render</button>
        </form>
    </div>

    <div class="main">
        <div class="preview-area">
            {% if error %}
                <div class="error-box">{{ error }}</div>
            {% endif %}

            {% if lines %}
                {% include 'code_component.html' %}
            {% else %}
                <div style="color:#999; text-align:center; margin-top:40px;">No code rendered</div>
            {% endif %}
        </div>

        <div class="bottom-panel">
            <div class="tabs">
                <button class="tab active" onclick="openTab(event, 'tab-inspector')">Node Inspector</button>
                <button class="tab" onclick="openTab(event, 'tab-trace')">Answer Trace</button>
            </div>
            
            <div id="tab-inspector" class="tab-content active">
                <div id="inspector-header" style="margin-bottom: 10px; font-weight: bold; border-bottom: 1px solid #eee; padding-bottom: 5px;">
                    Selected Token: <span id="selected-token-info" style="font-weight: normal; color: #666;">None</span>
                </div>
                <div id="node-info-content" class="node-path">
                    <span style="color: #999;">Select a token to view hierarchy...</span>
                </div>
            </div>
            
            <div id="tab-trace" class="tab-content">
                <div class="trace-container">
                    <div class="trace-controls">
                        <button onclick="clearTrace()" style="padding: 4px 8px;">Clear Trace</button>
                    </div>
                    <textarea id="trace-output" readonly></textarea>
                </div>
            </div>
        </div>
    </div>

    <!-- Data Injection -->
    <script>
        const AST_DATA = {{ nodes_json | safe }};
    </script>

    <script>
        // --- Tabs Logic ---
        function openTab(evt, tabName) {
            var i, tabcontent, tablinks;
            tabcontent = document.getElementsByClassName("tab-content");
            for (i = 0; i < tabcontent.length; i++) {
                tabcontent[i].style.display = "none";
                tabcontent[i].classList.remove("active");
            }
            tablinks = document.getElementsByClassName("tab");
            for (i = 0; i < tablinks.length; i++) {
                tablinks[i].classList.remove("active");
            }
            document.getElementById(tabName).style.display = "block";
            document.getElementById(tabName).classList.add("active");
            evt.currentTarget.classList.add("active");
        }

        // --- Trace Logic ---
        let traceData = [];

        function handleButtonClick(btn) {
            const actionId = btn.getAttribute('data-action_id');
            const nodeId = btn.getAttribute('data-node_id');
            const type = btn.classList.contains('play') ? 'play' : 
                         btn.classList.contains('stop') ? 'stop' : 'unknown';

            // Add to trace
            traceData.push({ actionId, nodeId, type });
            updateTraceView();
            
            // Switch to trace tab (optional, maybe annoying)
            // openTab({currentTarget: document.querySelector("button[onclick*='tab-trace']")}, 'tab-trace');
        }

        function updateTraceView() {
            let str = "List.of(\n";
            traceData.forEach((item, index) => {
                str += `\tPair.of(${item.actionId}, "${item.type}")`;
                if (index < traceData.length - 1) str += ",\n";
            });
            str += "\n);";
            document.getElementById('trace-output').value = str;
        }

        function clearTrace() {
            traceData = [];
            document.getElementById('trace-output').value = "";
        }

        // --- Inspector Logic ---
        function handleTokenClick(element) {
            const nodeId = element.getAttribute('data-node-id');
            const tokenIndex = element.getAttribute('data-token-index');
            const container = document.getElementById('node-info-content');
            
            // Сброс и подсветка выбранного токена
            document.querySelectorAll('.token').forEach(t => t.style.backgroundColor = '');
            element.style.backgroundColor = '#fff3cd';

            // Обновляем заголовок
            document.getElementById('selected-token-info').textContent = 
                `"${element.innerText}" (Index: ${tokenIndex})`;

            // Автопереключение на вкладку инспектора
            const inspectorTabBtn = document.querySelector("button[onclick*='tab-inspector']");
            if (!inspectorTabBtn.classList.contains('active')) {
                openTab({currentTarget: inspectorTabBtn}, 'tab-inspector');
            }

            if (!nodeId || !AST_DATA[nodeId]) {
                container.innerHTML = '<span style="color: #999;">Node info not available.</span>';
                return;
            }

            // Строим путь от текущей ноды к корню
            let currentId = nodeId;
            let path = [];
            while (currentId && AST_DATA[currentId]) {
                path.push(AST_DATA[currentId]);
                currentId = AST_DATA[currentId].parent_id;
            }

            let html = '';
            // Проходим от корня к листу (reverse)
            path.reverse().forEach((node, index) => {
                const indent = index * 15;
                
                // 1. Бейдж ID
                let badges = `<span class="badge" title="Node ID">#${node.id}</span>`;
                
                // 2. Бейдж Диапазона токенов (НОВОЕ)
                if (node.token_range) {
                    // node.token_range приходит как массив [start, end]
                    badges += `<span class="badge range-badge" title="Token Range indices">Tokens: ${node.token_range[0]} - ${node.token_range[1]}</span>`;
                }
                
                // 3. Бейдж Коллекции (если есть)
                if (node.collection_id !== null) {
                    const prefix = isNaN(node.collection_id) ? "Key" : "Idx";
                    badges += `<span class="badge" style="background:#e3f2fd; color:#0d47a1;">${prefix}: ${node.collection_id}</span>`;
                }

                const fieldStr = node.field ? `<span style="color:#666; margin-right:5px; font-weight:bold;">.${node.field}</span>` : '';

                html += `
                    <div class="node-item" style="margin-left: ${indent}px">
                        <div class="main-info">
                            ${fieldStr}
                            <span class="type">${node.type}</span>
                        </div>
                        <div class="meta">
                            ${badges}
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }
    </script>
</body>
</html>
