# ================================
# Универсальные управляющие структуры
# ================================

# kind: compound, condition, auto

# --------------------------------
# Глобальные операторы -- разновидность блока { ... }
# --------------------------------
global_statements_structure:
  kind: compound.sequence.program
  ast_node: program_entry_point
  metadata:
    locale_trace_name: "statement"
    locale_pronoun: "it"
  actions:
    - role: first
      kind: auto
      identification:
        origin: parent
        property_path: 'body / [0]'  # statements -> body
      generalization: item
    - role: next
      kind: auto
      identification:
        origin: previous
        property_path: '[next]'
      generalization: item
    - role: BEGIN
      kind: program
      metadata:
        locale_trace_name: "program"
        locale_pronoun: "she"
    - role: END
      kind: program
      metadata:
        locale_trace_name: "program"
        locale_pronoun: "she"
  transitions:
    - from: BEGIN
      to: first
    - from: item
      to: next       # переход к следующему элементу
      to_when_absent: END

# --------------------------------
# Условный оператор (if / else-if / else)
# --------------------------------
if_structure:
  kind: compound.alternative              # тип действия (ветвление)
  ast_node: if_statement
  metadata:
    locale_trace_name: "alternative"
    locale_pronoun: "she"
  actions:
    - role: first_cond             # первое условие ветвления
      kind: inline.condition        # true / false
      identification:
        property_path: 'branches / [0] / condition'
        role_in_list: first_in_list
      metadata:
        locale_trace_name: "condition"
        locale_pronoun: "it"
      generalization: cond
    - role: next_cond             # следующее условие ветвления
      kind: inline.condition
      identification:
        origin: previous
        property_path: '^ / [next] / condition'
        role_in_list: next_in_list
      metadata:
        locale_trace_name: "condition"
        locale_pronoun: "it"
      generalization: cond
    - role: if_branch           # ветка при true
      kind: compound
      identification:
        origin: previous
        property_path: '^ / body'
      generalization: branch
    - role: else_branch           # ветка при false
      kind: compound
      identification:
        property: elseBranch
      generalization: branch
  transitions:
    - from: BEGIN
      to: first_cond
    - from: cond
      to: if_branch                # → переход в "true"-ветку
      constraints:
        condition_value: true        # если условие истинно
    - from: cond
      to: next_cond
      to_when_absent: ['else_branch', 'END']   # → в "false"-ветку
      constraints:
        condition_value: false       # если ложно
    - from: branch
      to: END   # если ветка отсутствует, сразу окончание

# --------------------------------
# Цикл while
# --------------------------------
while_structure:
  kind: compound.loop
  ast_node: while_loop
  metadata:
    locale_trace_name: "loop"
    locale_pronoun: "he"
  effects:
    - interruption_stop: break
  actions:
    - role: cond
      kind: inline.condition
      metadata:
        locale_trace_name: "condition"
        locale_pronoun: "it"
      identification:
        property: condition
    - role: body
      kind: compound
      identification:
        property: body
      effects:
        - interruption_stop: continue
  transitions:
    - from: BEGIN
      to: cond
    - from: cond
      to: body
      constraints:
        condition_value: true        # если условие истинно → выполняем тело
    - from: cond
      to: END
      constraints:
        condition_value: false       # если ложно → выходим из цикла
    - from: body
      to: cond                   # после тела возвращаемся к условию

# --------------------------------
# Цикл while+else (Python only)
# --------------------------------
while_else_structure:
  applicable_languages: ["python"]
  kind: compound.loop
  ast_node: while_else_loop #TODO: такого цикла пока нет
  metadata:
    locale_trace_name: "loop"
    locale_pronoun: "he"
  effects:
    - interruption_stop: break
  actions:
    - role: cond
      kind: inline.condition
      metadata:
        locale_trace_name: "condition"
        locale_pronoun: "it"
    - role: body
      kind: compound
      effects:
        - interruption_stop: continue
    - role: else
      kind: compound
  transitions:
    - from: BEGIN
      to: cond
    - from: cond
      to: body
      constraints:
        condition_value: true      # если условие истинно → выполняем тело
    - from: body
      to: cond                   # после тела возвращаемся к условию
    - from: cond
      to: else
      constraints:
        condition_value: false     # если ложно → выходим в else
    - from: else
      to: END

# --------------------------------
# Цикл do-while
# --------------------------------
do_while_structure:
  kind: compound.loop
  ast_node: do_while_loop
  metadata:
    locale_trace_name: "loop"
    locale_pronoun: "he"
  effects:
    - interruption_stop: break
  actions:
    - role: body
      kind: compound
      effects:
        - interruption_stop: continue
    - role: cond
      kind: inline.condition
      metadata:
        locale_trace_name: "condition"
        locale_pronoun: "it"
  transitions:
    - from: BEGIN
      to: body
    - from: body
      to: cond              # сначала выполняем тело
    - from: cond
      to: body
      constraints:
        condition_value: true        # если условие истинно → снова тело
    - from: cond
      to: END
      constraints:
        condition_value: false       # иначе → выход

# --------------------------------
# Цикл for (универсальная форма)
# --------------------------------
for_structure:
  kind: compound.loop
  ast_node: general_for_loop
  metadata:
    locale_trace_name: "loop"
    locale_pronoun: "he"
  effects:
    - interruption_stop: break
  actions:
    - role: init
      kind: inline.optional
    - role: cond
      kind: inline.condition
      metadata:
        locale_trace_name: "condition"
        locale_pronoun: "it"
      behaviour:
        assumed_value: true
    - role: body
      kind: compound
      effects:
        - interruption_stop: continue
    - role: update
      kind: inline.optional
  transitions:
    - from: BEGIN
      to: init
    - from: init
      to: cond
    - from: cond
      to: body
      constraints:
        condition_value: true
    - from: cond
      to: END
      constraints:
        condition_value: false       # false → выход
    - from: body
      to: update
    - from: update
      to: cond

# --------------------------------
# Цикл for each (по контейнеру)
# --------------------------------
for_each_structure:
  kind: compound.loop
  ast_node: for_each_loop
  metadata:
    locale_trace_name: "loop"
    locale_pronoun: "he"
  effects:
    - interruption_stop: break
  actions:
    - role: init
      kind: inline
      identification:
        property: 'container'
      metadata:
        locale_trace_name: "container"
        locale_pronoun: "he"
    - role: cond
      kind: inline.condition
      behaviour:
        assumed_value: true
      metadata:
        locale_trace_name: "condition_for_each"
        locale_pronoun: "it"
      identification:
        property_path: 'item / declarators / [0] / identifier'
    - role: body
      kind: compound
      identification:
        property: body
      effects:
        - interruption_stop: continue
  transitions:
    - from: BEGIN
      to: init
    - from: init
      to: cond
    - from: cond
      to: body
      constraints:
        condition_value: true
    - from: cond
      to: END
      constraints:
        condition_value: false       # false → выход
    - from: body
      to: cond

# --------------------------------
# Цикл for по диапазону (range_for_loop)
# --------------------------------
for_range_structure:
  kind: compound.loop
  ast_node: range_for_loop
  metadata:
    locale_trace_name: "loop"
    locale_pronoun: "he"
  effects:
    - interruption_stop: break
  actions:
    - role: init
      kind: inline
      metadata:
        locale_trace_name: "init"
        locale_pronoun: "she"
      identification:
        property: 'range'
    - role: cond
      kind: inline.condition
      metadata:
        locale_trace_name: "condition_range_for"
        locale_pronoun: "it"
      identification:
        property: 'identifier'
    - role: body
      kind: compound
      identification:
        property: body
      effects:
        - interruption_stop: continue
  transitions:
    - from: BEGIN
      to: init
    - from: init
      to: cond
    - from: cond
      to: body
      constraints:
        condition_value: true
    - from: cond
      to: END
      constraints:
        condition_value: false       # false → выход
    - from: body
      to: cond

# --------------------------------
# Блок операторов { ... }
# --------------------------------
block_structure:
  kind: compound.sequence.block
  ast_node: compound_statement
  metadata:
    locale_trace_name: "block"
    locale_pronoun: "he"
  actions:
    - role: first
      kind: auto
      identification:
        origin: parent
        property_path: 'statements / [0]'
      generalization: item
    - role: next
      kind: auto
      identification:
        origin: previous
        property_path: '[next]'
      generalization: item
  transitions:
    - from: BEGIN
      to: first
    - from: item
      to: next       # переход к следующему элементу
      to_when_absent: END

# --------------------------------
# Определение функции
# --------------------------------
func_def_structure:
  kind: compound.external.noop
  ast_node: ['function_definition', 'method_definition']
  actions:
    - role: name
      opaque: false
      kind: identifier
      identification:
        property_path: 'declaration / name'
    - role: func_body
      kind: compound
      identification:
        property: 'body'
  transitions:
    - from: BEGIN
      to: func_body
    - from: func_body
      to: END

# --------------------------------
# Вызов функции
# --------------------------------
func_call_structure:
  kind: inline.call
  ast_node: ['function_call'] #TODO: add methods
  metadata:
    locale_trace_name: "function_call"
    locale_pronoun: "he"
  actions:
    - role: name
      kind: identifier
      identification:
        property_path: 'function / name'
    - role: func
      kind: compound
      # identification: func def lookup (see Python code)
      effects:
        - interruption_stop: return
    - role: END
      kind: END
      effects:
        - interruption_stop: return
  transitions:
    - from: BEGIN
      to: func
      effects:
        - call_stack: add_frame        # при входе в функцию создаём стековый фрейм
    - from: func
      to: END
      constraints:
        interruption_mode: any  # В любом случае
      effects:
        - interruption_stop: return
        - call_stack: drop_frame       # при выходе убираем фрейм

# --------------------------------
# return
# --------------------------------
return_action:
  kind: inline  # this kind matters
  ast_node: return_statement
  metadata:
    locale_trace_name: 'return'
    locale_pronoun: 'it'
  effects:
    - interruption_start: return

return_compound_action:
  kind: inline.compound
  ast_node:
    query:
      - type: return_statement
        contains_any:
          key: "type"
          value_in: [
            'function_call',
            'method_call' # могут быть другие вложенные конструкты
          ]
  actions:
    - role: BEGIN
      kind: auto
      opaque: true
    - role: content
      opaque: false
      kind: auto
  transitions:
    - from: BEGIN
      to: content
    - from: content
      to: content
      to_when_absent: END

# --------------------------------
# break
# --------------------------------
break_action:
  kind: inline
  ast_node: break_statement
  effects:
    - interruption_start: break

# --------------------------------
# continue
# --------------------------------
continue_action:
  kind: inline
  ast_node: continue_statement
  effects:
    - interruption_start: continue


# --------------------------------
# Блок try-except c нетипизированной (неизбирательной) ловлей исключений
# --------------------------------
try_except_structure:
  disabled: true  # TODO: not implemented yet
  kind: compound.try
  ast_node: exception_catch_statement 
  effects:
    - interruption_stop: exception
  actions:
    - role: try
      kind: compound
    - role: catch
      kind: compound
    - role: else     # entered if no exception was raised. Python only.
      kind: compound
    - role: finally
      kind: compound
  transitions:
    - from: BEGIN
      to: try
    - from: try
      to: catch                     # в блок catch, если
      constraints:
        interruption_mode: exception  # были исключения
      effects:
        - interruption_stop: exception
    - from: try
      to: else                 # в блок else, если
      constraints:
        interruption_mode: no_interruption
    - from: catch
      to: finally
      constraints:
        interruption_mode: any  # В любом случае
    - from: else
      to: finally
      constraints:
        interruption_mode: any  # В любом случае
    - from: finally
      to: END
      # polyfill interruption exits...
    - from: try
      to: END
      constraints:
        interruption_mode: return
    - from: try
      to: END
      constraints:
        interruption_mode: break
    - from: try
      to: END
      constraints:
        interruption_mode: continue


# --------------------------------
# Заглушка для всех простых действий (с одной кнопкой СТАРТ)
# --------------------------------
inline_atom_ast_nodes: &inline_atom_ast_nodes
  - identifier
  - variable_declaration
  - not_eq_operator
  - not_operator
  - assignment_statement
  - expression_statement
  - int_literal
  - bool_literal
  - add_operator
  - eq_operator
  - reference_eq_operator
  - lt_operator
  - gt_operator
  - le_operator
  - ge_operator
  - contains_operator
  - short_circuit_and_operator
  - short_circuit_or_operator
  - multiple_assignment_statement
  - range
  - compound_comparison
  - parenthesized_expression
  # TODO: add new here


inline_atom_structure:
  kind: inline
  ast_node: *inline_atom_ast_nodes

inline_compound_atom_structure:
  kind: inline.compound
  ast_node:
    query:
      - type: *inline_atom_ast_nodes
        contains_any:
          key: "type"
          value_in: [
            'function_call',
            'method_call' # могут быть другие вложенные конструкты
          ]
  actions:
    - role: BEGIN
      kind: auto
      opaque: true
    - role: content
      opaque: false
      kind: auto
  transitions:
    - from: BEGIN
      to: content
    - from: content
      to: content
      to_when_absent: END

# --------------------------------
# Заглушка для комментария и др. незначимых для CFG действий (без кнопок)
# --------------------------------
noop_structure:
  kind: noop
  ast_node: [
    'comment',
    'class_definition',
    'import_module',
    'import_members_from_module',
    # TODO: add more no-op ast node types here
  ]

