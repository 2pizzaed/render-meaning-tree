<style>
    .trace-container {
        display: flex;
        flex-direction: column;
        height: 100%;
        min-height: 0;
        gap: 10px;
    }

    .trace-toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        flex: 0 0 auto;
    }

    .trace-primary-actions,
    .trace-clipboard-actions {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
    }

    .trace-action-button,
    .trace-icon-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        height: 30px;
        border: 1px solid #d6dbe4;
        border-radius: 6px;
        background: #fff;
        color: #243142;
        cursor: pointer;
        font: inherit;
        font-size: 12px;
    }

    .trace-action-button {
        padding: 0 10px;
        gap: 6px;
        font-weight: 600;
    }

    .trace-icon-button {
        width: 30px;
        padding: 0;
        font-size: 16px;
    }

    .trace-action-button:hover,
    .trace-icon-button:hover {
        background: #f4f7fb;
        border-color: #aeb9c8;
    }

    .trace-action-button:disabled,
    .trace-icon-button:disabled {
        cursor: not-allowed;
        opacity: 0.55;
    }

    .trace-workspace {
        display: grid;
        grid-template-rows: auto minmax(0, 1fr);
        gap: 10px;
        flex: 1;
        min-height: 0;
    }

    .reason-alert {
        padding: 10px 12px;
        border: 1px solid;
        border-radius: 4px;
        font-size: 13px;
    }

    .reason-alert.hidden,
    .reason-variables.hidden {
        display: none;
    }

    .reason-alert.correct {
        background: #e8f5e9;
        color: #1b5e20;
        border-color: #a5d6a7;
    }

    .reason-alert.error {
        background: #ffebee;
        color: #b71c1c;
        border-color: #ef9a9a;
    }

    .reason-alert.unknown {
        background: #fff8e1;
        color: #795548;
        border-color: #ffe082;
    }

    .reason-alert-header {
        display: flex;
        gap: 10px;
        align-items: flex-start;
        justify-content: space-between;
    }

    .reason-alert-title {
        min-width: 0;
    }

    .reason-alert-badges {
        display: flex;
        gap: 6px;
        align-items: center;
        justify-content: flex-end;
        flex-wrap: wrap;
        flex: 0 0 auto;
        margin-left: auto;
    }

    .reason-badge {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 3px 7px;
        border: 1px solid currentColor;
        border-radius: 999px;
        font-family: 'Consolas', monospace;
        font-size: 11px;
        white-space: nowrap;
        background: rgba(255,255,255,0.65);
    }

    .reason-badge strong {
        font-family: inherit;
        font-weight: 700;
    }

    .reason-alert .reason-line {
        margin-top: 4px;
    }

    .reason-variables {
        border: 1px solid #ddd;
        border-radius: 4px;
        overflow: hidden;
        font-size: 12px;
        flex: 0 0 auto;
    }

    .reason-variables table {
        width: 100%;
        border-collapse: collapse;
    }

    .reason-variables th,
    .reason-variables td {
        padding: 6px 8px;
        border-bottom: 1px solid #eee;
        text-align: left;
        font-family: 'Consolas', monospace;
    }

    .reason-variables th {
        background: #f7f7f7;
        font-family: inherit;
    }

    .reason-variables tr:last-child td {
        border-bottom: none;
    }

    .trace-list {
        display: flex;
        flex-direction: column;
        gap: 6px;
        min-height: 120px;
        overflow-y: auto;
        padding: 8px;
        border: 1px dashed #b8c2d0;
        border-radius: 6px;
        background: #f8fafc;
    }

    .trace-list.drag-over {
        border-color: #0066cc;
        background: #eef6ff;
    }

    .trace-empty {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 90px;
        color: #6b7280;
        font-size: 13px;
        text-align: center;
    }

    .trace-item {
        display: grid;
        grid-template-columns: 28px minmax(0, 1fr) 28px;
        align-items: center;
        gap: 8px;
        min-height: 36px;
        padding: 4px 6px;
        border: 1px solid #d9e0ea;
        border-radius: 6px;
        background: #fff;
        box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
    }

    .trace-item.dragging {
        opacity: 0.45;
    }

    .trace-drag-handle {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 24px;
        height: 24px;
        color: #64748b;
        cursor: grab;
        font-size: 16px;
    }

    .trace-label {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-family: 'Consolas', monospace;
        font-size: 12px;
        color: #1f2937;
    }

    .trace-delete-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 24px;
        height: 24px;
        padding: 0;
        border: none;
        border-radius: 4px;
        background: transparent;
        color: #9f1239;
        cursor: pointer;
        font-size: 16px;
    }

    .trace-delete-button:hover {
        background: #ffe4e6;
    }
</style>

<div class="trace-container">
    <div class="trace-toolbar">
        <div class="trace-primary-actions">
            <button type="button" class="trace-action-button" onclick="clearTrace()">Clear trace</button>
            {% if not static_used %}
            <button type="button" id="reason-button" class="trace-action-button" onclick="reasonTrace()">Reason</button>
            <button type="button" id="tracing-button" class="trace-action-button" onclick="openCorrectTrace()">Tracing</button>
            {% endif %}
        </div>
        <div class="trace-clipboard-actions">
            <button type="button" class="trace-icon-button" onclick="copyTraceJson()" title="Copy trace JSON" aria-label="Copy trace JSON">
                <i class="ri-file-copy-line" aria-hidden="true"></i>
            </button>
            <button type="button" class="trace-icon-button" onclick="pasteTraceJson()" title="Paste trace JSON" aria-label="Paste trace JSON">
                <i class="ri-clipboard-line" aria-hidden="true"></i>
            </button>
        </div>
    </div>

    <div class="trace-workspace">
        <div id="reason-status" class="reason-alert hidden"></div>
        <div id="reason-variables" class="reason-variables hidden"></div>
        <div id="trace-list" class="trace-list" aria-label="Trace actions"></div>
    </div>
</div>

<script>
    var traceData = [];
    var draggedTraceIndex = null;

    function updateTraceView() {
        const list = document.getElementById('trace-list');
        if (!list) return;
        list.innerHTML = '';

        if (traceData.length === 0) {
            const empty = document.createElement('div');
            empty.className = 'trace-empty';
            empty.textContent = 'Trace is empty. Click rendered action buttons to add steps.';
            list.appendChild(empty);
            return;
        }

        traceData.forEach((traceAction, index) => {
            list.appendChild(createTraceItem(traceAction, index));
        });
    }

    function createTraceItem(traceAction, index) {
        const item = document.createElement('div');
        item.className = 'trace-item';
        item.draggable = true;
        item.dataset.index = String(index);

        const handle = document.createElement('span');
        handle.className = 'trace-drag-handle';
        handle.innerHTML = '<i class="ri-draggable" aria-hidden="true"></i>';
        handle.title = 'Drag trace step';

        const label = document.createElement('span');
        label.className = 'trace-label';
        label.textContent = traceAction;
        label.title = traceAction;

        const deleteButton = document.createElement('button');
        deleteButton.type = 'button';
        deleteButton.className = 'trace-delete-button';
        deleteButton.title = 'Delete trace step';
        deleteButton.setAttribute('aria-label', 'Delete trace step');
        deleteButton.innerHTML = '<i class="ri-close-line" aria-hidden="true"></i>';
        deleteButton.addEventListener('click', () => removeTraceItem(index));

        item.append(handle, label, deleteButton);
        item.addEventListener('dragstart', handleTraceDragStart);
        item.addEventListener('dragend', handleTraceDragEnd);
        item.addEventListener('dragover', handleTraceDragOver);
        item.addEventListener('drop', handleTraceDrop);

        return item;
    }

    function clearTrace() {
        traceData = [];
        updateTraceView();
        renderReasoningResult(null);
    }

    function removeTraceItem(index) {
        traceData.splice(index, 1);
        updateTraceView();
        renderReasoningResult(null);
    }

    function handleTraceDragStart(event) {
        draggedTraceIndex = Number(event.currentTarget.dataset.index);
        event.currentTarget.classList.add('dragging');
        event.dataTransfer.effectAllowed = 'move';
        event.dataTransfer.setData('text/plain', String(draggedTraceIndex));
    }

    function handleTraceDragEnd(event) {
        draggedTraceIndex = null;
        event.currentTarget.classList.remove('dragging');
        document.getElementById('trace-list')?.classList.remove('drag-over');
    }

    function handleTraceDragOver(event) {
        event.preventDefault();
        event.dataTransfer.dropEffect = 'move';
        document.getElementById('trace-list')?.classList.add('drag-over');
    }

    function handleTraceDrop(event) {
        event.preventDefault();
        document.getElementById('trace-list')?.classList.remove('drag-over');

        const targetIndex = Number(event.currentTarget.dataset.index);
        if (!Number.isInteger(draggedTraceIndex) || !Number.isInteger(targetIndex) || draggedTraceIndex === targetIndex) {
            return;
        }

        const [movedAction] = traceData.splice(draggedTraceIndex, 1);
        traceData.splice(targetIndex, 0, movedAction);
        updateTraceView();
        renderReasoningResult(null);
    }

    async function copyTraceJson() {
        try {
            await navigator.clipboard.writeText(JSON.stringify(traceData, null, 2));
        } catch (error) {
            alert(`Could not copy trace JSON: ${error}`);
        }
    }

    async function pasteTraceJson() {
        let clipboardText = '';
        try {
            clipboardText = await navigator.clipboard.readText();
        } catch (error) {
            alert(`Could not read trace JSON from clipboard: ${error}`);
            return;
        }

        let parsedTrace;
        try {
            parsedTrace = JSON.parse(clipboardText);
        } catch (error) {
            alert(`Trace JSON has invalid syntax: ${error.message}`);
            return;
        }

        if (!isTraceJson(parsedTrace)) {
            alert('Trace JSON format error: expected an array of strings.');
            return;
        }

        traceData = parsedTrace;
        updateTraceView();
        renderReasoningResult(null);
    }

    function isTraceJson(value) {
        return Array.isArray(value) && value.every((item) => typeof item === 'string');
    }

    async function reasonTrace() {
        const button = document.getElementById('reason-button');
        if (!button || traceData.length === 0) {
            renderReasoningResult({ok: false, error: 'Select at least one trace action before running Reason.'});
            return;
        }

        button.disabled = true;
        button.textContent = 'Reasoning...';
        try {
            const response = await fetch('/reason-trace', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    code: document.querySelector('textarea[name="code"]')?.value || '',
                    language: document.querySelector('select[name="language"]')?.value || 'java',
                    target_language: document.querySelector('select[name="target_language"]')?.value || '',
                    trace: traceData,
                }),
            });
            const payload = await response.json();
            renderReasoningResult(payload);
        } catch (error) {
            renderReasoningResult({ok: false, error: String(error)});
        } finally {
            button.disabled = false;
            button.textContent = 'Reason';
        }
    }

    function openCorrectTrace() {
        const form = document.createElement('form');
        form.method = 'POST';
        form.action = '/tracing';
        form.target = '_blank';
        form.style.display = 'none';
        appendHiddenInput(form, 'code', document.querySelector('textarea[name="code"]')?.value || '');
        appendHiddenInput(form, 'language', document.querySelector('select[name="language"]')?.value || 'java');
        document.body.appendChild(form);
        form.submit();
        form.remove();
    }

    function appendHiddenInput(form, name, value) {
        const input = document.createElement('input');
        input.type = 'hidden';
        input.name = name;
        input.value = value;
        form.appendChild(input);
    }

    function renderReasoningResult(payload) {
        const statusBox = document.getElementById('reason-status');
        const variablesBox = document.getElementById('reason-variables');
        if (!statusBox || !variablesBox) return;
        statusBox.className = 'reason-alert hidden';
        statusBox.innerHTML = '';
        variablesBox.className = 'reason-variables hidden';
        variablesBox.innerHTML = '';
        if (!payload) return;

        if (!payload.ok) {
            statusBox.className = 'reason-alert error';
            statusBox.textContent = payload.error || 'Reasoning failed.';
            return;
        }

        const reasoning = payload.reasoning || {};
        const status = reasoning.status || 'unknown';
        statusBox.className = `reason-alert ${status}`;
        const headerLines = [
            `<div class="reason-alert-title"><strong>${status === 'correct' ? 'Correct' : status === 'error' ? 'Incorrect' : 'Unknown result'}</strong>`,
        ];
        if (reasoning.hasException) {
            const names = (reasoning.exceptionNames || []).filter(Boolean).join(', ');
            headerLines.push(`<div class="reason-line">An exception occurred${names ? `: ${escapeHtml(names)}` : '.'}</div>`);
        }
        headerLines.push(`</div>`);

        const badgeParts = [];
        if (reasoning.finalNodeId) {
            badgeParts.push(`<span class="reason-badge"><strong>id</strong> ${escapeHtml(reasoning.finalNodeId)}</span>`);
        }
        const lineText = Array.isArray(reasoning.finalNodeLine) ? reasoning.finalNodeLine.join(', ') : '';
        if (lineText) {
            badgeParts.push(`<span class="reason-badge"><strong>line</strong> ${escapeHtml(lineText)}</span>`);
        }
        const skillText = (reasoning.skills || []).filter(Boolean).join(', ');
        if (skillText) {
            badgeParts.push(`<span class="reason-badge"><strong>skill</strong> ${escapeHtml(skillText)}</span>`);
        }
        statusBox.innerHTML = [
            `<div class="reason-alert-header">`,
            headerLines.join(''),
            badgeParts.length > 0 ? `<div class="reason-alert-badges">${badgeParts.join('')}</div>` : '',
            `</div>`,
            ...(reasoning.explanations || []).map((text) => `<div class="reason-line">Explanation: ${escapeHtml(text)}</div>`),
        ].join('');

        const variables = reasoning.variables || {};
        const entries = Object.entries(variables);
        if (entries.length > 0) {
            variablesBox.className = 'reason-variables';
            variablesBox.innerHTML = `<table><thead><tr><th>Variable</th><th>Value</th></tr></thead><tbody>${
                entries.map(([name, value]) => `<tr><td>${escapeHtml(name)}</td><td>${escapeHtml(String(value))}</td></tr>`).join('')
            }</tbody></table>`;
        }
    }

    updateTraceView();
</script>
